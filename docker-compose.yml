version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      - db

  frontend:
    build: ./frontend/PRYSM-Fr-main/PRYSM-Fr-main
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./frontend/PRYSM-Fr-main/PRYSM-Fr-main:/app
      - /app/node_modules
    command: npm run dev

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: prysm
      POSTGRES_USER: prysm
      POSTGRES_PASSWORD: prysm_dev
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
